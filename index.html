<!DOCTYPE html>
<html lang="pt-BR">

<style>
  :root{
    --bordo:#6B1E2E; --bordo-dark:#4A1220; --bordo-light:#8B3345;
    --creme:#F5EFE4; --creme-dark:#EDE4D4; --marrom:#A0785A;
    --marrom-light:#C4A882; --marrom-dark:#7A5840;
    --text:#2C1810; --text-light:#6B4F3A; --white:#FDFAF6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden;max-width:100vw}
  body{font-family:'Jost',sans-serif;background:var(--creme);color:var(--text);min-height:100vh}
  a{color:inherit}

  #carregandoOverlay{position:fixed;inset:0;z-index:99999;background:linear-gradient(145deg,#4A1220 0%,#2C0A14 60%,#1A0008 100%);display:flex;align-items:center;justify-content:center;color:#C4A882;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:20px}

  #appRoot{display:none}
  .app-shell{display:flex;align-items:stretch;min-height:100vh}
  .sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--bordo-dark),var(--bordo) 60%,var(--marrom-dark));display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:150;box-shadow:0 8px 32px rgba(44,24,16,.18)}
  .side-header{padding:24px 20px 16px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.12)}
  .side-header .brand{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.3rem;color:var(--creme)}
  .side-header .brand-sub{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--marrom-light);margin-top:-2px}
  .side-header .field{margin-top:14px;margin-bottom:0}
  .side-header .field label{color:var(--marrom-light)}
  .side-header select.inp{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:var(--creme)}
  .side-header select.inp option{color:var(--text)}
  .side-links{padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
  .hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--creme);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.76rem;text-decoration:none;display:flex;align-items:center;gap:6px;transition:background .15s;width:100%;text-align:left}
  .hbtn:hover{background:rgba(255,255,255,.2)}
  nav.tabs{display:flex;flex-direction:column;gap:2px;background:none;border:none;padding:10px 12px;overflow-y:auto;flex:1}
  .tab{padding:11px 14px;font-size:.82rem;font-weight:500;color:var(--marrom-light);cursor:pointer;border-left:3px solid transparent;border-radius:8px;white-space:normal;line-height:1.3;transition:all .15s}
  .tab:hover{color:var(--creme);background:rgba(255,255,255,.08)}
  .tab.active{color:var(--creme);border-left-color:var(--creme);background:rgba(255,255,255,.14);font-weight:600}
  .sidebar-close{display:none}
  .content-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
  .mobile-topbar{display:none}
  main{max-width:1180px;margin:0 auto;padding:28px 26px 60px;width:100%}
  .card{background:var(--white);border:1px solid var(--creme-dark);border-radius:12px;padding:22px;margin-bottom:18px}
  .card h2{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--bordo-dark);margin-bottom:14px}
  .card h3{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--bordo-dark);margin:18px 0 10px}
  .card p.hint{font-size:.82rem;color:var(--text-light);margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);font-weight:500}
  .inp,select.inp,textarea.inp{padding:9px 12px;border:1.5px solid var(--creme-dark);border-radius:7px;font-family:'Jost',sans-serif;font-size:.85rem;color:var(--text);background:var(--white)}
  .inp:focus{outline:none;border-color:var(--marrom)}
  .btn{background:var(--bordo);color:var(--creme);border:none;padding:10px 18px;border-radius:7px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--bordo-dark)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-outline{background:none;border:1.5px solid var(--bordo);color:var(--bordo)}
  .btn-outline:hover{background:var(--bordo);color:var(--creme)}
  .btn-danger{background:none;border:none;color:#B43C3C;cursor:pointer;font-size:.85rem}
  .btn-sm{padding:6px 12px;font-size:.72rem}

  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;min-width:520px;border-collapse:collapse;font-size:.82rem}
  th{text-align:left;padding:9px 10px;background:var(--creme);color:var(--text-light);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
  td{padding:9px 10px;border-top:1px solid var(--creme-dark);vertical-align:middle}

  tr:hover td{background:#faf8f5}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:600;white-space:nowrap}
  .badge-andamento{background:#EAF2FB;color:#2E6DA4}
  .badge-concluido{background:#E8F8F0;color:#27AE60}
  .badge-naoiniciada{background:#FBE2E2;color:#B43C3C}
  .badge-zerado{background:#FBE2E2;color:#B43C3C;font-weight:700}
  .badge-baixo{background:#FEF6E7;color:#B8860B;font-weight:700}
  .badge-semanal{background:var(--creme);color:var(--text-light)}

  .alert-banner.warn{background:#FEF6E7;border-color:#F0D9A0;color:#8A6A16}
  .alert-banner.info{background:#EAF2FB;border-color:#BFD8F0;color:#2E6DA4}
  .alert-banner.ok{background:#E8F8F0;border-color:#B7E4C7;color:#2D6A4F}

  .categoria-titulo .cat-repetir{font-size:.68rem;font-weight:600;color:var(--marrom-dark);cursor:pointer;text-transform:uppercase;letter-spacing:.04em;background:none;border:none}

  .item-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--creme-dark)}
  .item-row:last-child{border-bottom:none}
  .item-row .item-nome{flex:1;font-size:.85rem}
  .item-row .item-nome .item-inativo-tag{font-size:.65rem;color:#B8860B;background:#FEF6E7;padding:1px 7px;border-radius:10px;margin-left:6px;text-transform:uppercase;letter-spacing:.03em}

  .item-row input.item-qtd{width:90px;padding:7px 8px;border:1.5px solid var(--creme-dark);border-radius:6px;font-size:.85rem;text-align:right}

  .item-row .item-repetir{background:none;border:none;color:var(--marrom-dark);cursor:pointer;font-size:.85rem;padding:2px 4px}
  .item-row .item-repetir:disabled{opacity:.25;cursor:default}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(44,24,16,.5);z-index:500;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.show{display:flex}
  .modal{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--white);border-radius:14px;padding:26px}
  .modal h3{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--bordo-dark);margin-bottom:14px}
  .modal-actions{display:flex;gap:10px;margin-top:16px}
  .modal-close{background:none;border:none;color:var(--marrom-dark);text-decoration:underline;cursor:pointer;font-size:.78rem;display:block;margin:14px auto 0}
  .msg{font-size:.78rem;margin-top:8px;display:none}
  .msg.show{display:block}
  .msg.err{color:#B43C3C}
  .msg.ok{color:#27AE60}

  @media(max-width:900px){
    .app-shell{display:block}
    .sidebar{position:fixed;left:-270px;top:0;height:100vh;transition:left .25s ease;width:260px}
    .sidebar.open{left:0}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:140}
    .sidebar-overlay.show{display:block}
    .sidebar-close{display:flex;align-items:center;justify-content:center;position:absolute;top:14px;right:12px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--creme);border:none;cursor:pointer;font-size:1rem;z-index:2}
    .mobile-topbar{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--bordo-dark),var(--bordo));padding:0 16px;height:54px;position:sticky;top:0;z-index:120;box-shadow:0 2px 14px rgba(74,18,32,.25)}
    .mobile-topbar .hamb{background:rgba(255,255,255,.12);border:none;color:var(--creme);width:34px;height:34px;border-radius:8px;font-size:1.1rem;cursor:pointer;flex-shrink:0}
    .mobile-topbar .brand{font-size:1.05rem;color:var(--creme)}
  }
  @media (max-width:600px){
    main{padding:20px 16px 50px}
    .card{padding:16px}
    .item-row{flex-wrap:wrap}
    .item-row .item-anterior{min-width:auto;order:3;flex-basis:100%;text-align:left}
  }
</style>
</head>
<body>

<div id="carregandoOverlay">Carregando…</div>

<div id="appRoot">
<div class="mobile-topbar">

    <div class="side-header">

<!-- Modal genérico de confirmação simples -->

  <div class="modal">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://pbuhwpcpdcnaheaywmdv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBidWh3cGNwZGNuYWhlYXl3bWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjU5MzksImV4cCI6MjA5MTg0MTkzOX0.Mg4PVg96ZiV3C2Rn0GLQU9c7ui_41OlU6Ldqn5jcvyY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PORTAL_URL = 'https://thiagodlborges.github.io/Sistema-Luna/';
const $ = id => document.getElementById(id);

const TODAS_LOJAS = ['Esplanada','Cianê','Tucuruvi','Indaiatuba','Jundiaí','Praça da Moça - Diadema','Buriti Mogi Guaçu','SP Market','Iguatemi Campinas','Shopping Itaquera','Atrium'];
const CATEGORIAS_PRECIFICACAO = ['Gelato','Potes','Confeitaria','Picolés'];
let ORDEM_CATEGORIAS = ['Gelato','Potes','Confeitaria','Picolés']; // completado dinamicamente em carregarCatalogo()
let categoriasDinamicasCache = []; // [{id, nome, ordem, ativo}] — vindas de inventario_categorias

let meuPerfil = null;
let minhasLojas = [];
let lojaAtual = null;
let currentTab = null;
let souMaster = false;
let souBackoffice = false;
let souGerencial = false;
let souPainelCentral = false;
let temPapelDeLoja = false;

let catalogoCache = null; // { 'Gelato':[{id,nome,ativo}], ..., 'Insumo':[...] }
let contagemAtiva = null; // registro de inventario_contagens em edição
let itensAtuais = {}; // chave -> {quantidade, replicado}
let itensAnteriores = {}; // chave -> quantidade (última contagem finalizada)

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtData(d){ return d ? new Date(d+'T12:00').toLocaleDateString('pt-BR') : '—'; }
function fmtDataHora(dt){ return dt ? new Date(dt).toLocaleString('pt-BR') : '—'; }
function hojeISO(){ return new Date().toISOString().slice(0,10); }
function fecharModal(id){ $(id).classList.remove('show'); }
function showMsg(id, txt, tipo){ const m=$(id); if(!m) return; m.textContent=txt; m.className='msg'+(txt?' show '+(tipo||''):''); }
function ultimoDiaDoMes(d){ const x = new Date(d.getFullYear(), d.getMonth()+1, 0); return x.getDate() === d.getDate(); }
function isoDataLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// Decide qual "dia de referência" vale pra hoje, já considerando:
// - 1 dia de tolerância (dá pra enviar até o dia seguinte ao dia programado)
// - na semana em que cai o fim do mês, a contagem semanal daquela semana não é necessária
function calcularDiaReferencia(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const ontem = new Date(hoje); ontem.setDate(hoje.getDate()-1);

  const semanaContemMensal = (data) => {
    const inicio = new Date(data); inicio.setDate(data.getDate() - ((data.getDay()+6)%7)); // segunda-feira da semana
    for (let i=0;i<7;i++){ const d = new Date(inicio); d.setDate(inicio.getDate()+i); if (ultimoDiaDoMes(d)) return true; }
    return false;
  };

  if (ultimoDiaDoMes(hoje)) return { iso: isoDataLocal(hoje), tipo:'mensal', motivo:'Hoje é dia programado para a contagem mensal (fim de mês)', programado:true };
  if (ultimoDiaDoMes(ontem)) return { iso: isoDataLocal(ontem), tipo:'mensal', motivo:'A contagem mensal de ontem ainda está dentro do prazo (1 dia de tolerância)', programado:true };
  if (hoje.getDay()===2 && !semanaContemMensal(hoje)) return { iso: isoDataLocal(hoje), tipo:'semanal', motivo:'Hoje é dia programado para a contagem semanal (terça-feira)', programado:true };
  if (ontem.getDay()===2 && !semanaContemMensal(ontem)) return { iso: isoDataLocal(ontem), tipo:'semanal', motivo:'A contagem semanal de ontem ainda está dentro do prazo (1 dia de tolerância)', programado:true };
  if (hoje.getDay()===2 && semanaContemMensal(hoje)) return { iso: isoDataLocal(hoje), tipo:null, motivo:'Essa semana já tem a contagem mensal programada — não precisa da semanal também', programado:false, semanalDispensada:true };
  return { iso: isoDataLocal(hoje), tipo:null, motivo:null, programado:false };
}
function chaveItem(categoria, id){ return categoria + ':' + id; }

async function sairApp(){
  await sb.auth.signOut();
  window.location.href = PORTAL_URL;
}
function toggleSidebar(){ $('sidebar').classList.toggle('open'); $('sidebarOverlay').classList.toggle('show'); }
function fecharSidebar(){ $('sidebar').classList.remove('open'); $('sidebarOverlay').classList.remove('show'); }

function abrirModalConfirm(titulo, texto, onOk){
  $('modalConfirmTitulo').textContent = titulo;
  $('modalConfirmTexto').textContent = texto;
  const btn = $('modalConfirmBtnOk');
  const novoBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(novoBtn, btn);
  novoBtn.onclick = () => { fecharModal('modalConfirm'); onOk(); };
  $('modalConfirm').classList.add('show');
}

async function verificarAcessoEIniciar(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = PORTAL_URL; return; }

  const { data: ok, error } = await sb.rpc('tem_acesso', { p_slug: 'cmv' });
  if (error || !ok) { await sb.auth.signOut(); window.location.href = PORTAL_URL; return; }

  const { data: perfil } = await sb.from('perfis').select('*').eq('id', session.user.id).single();
  if (!perfil) { window.location.href = PORTAL_URL; return; }
  meuPerfil = perfil;

  souMaster = perfil.tipo === 'master';
  souBackoffice = souMaster || perfil.cmv_backoffice === true;
  souGerencial = souBackoffice || perfil.tipo === 'backoffice';
  souPainelCentral = souMaster || perfil.inventario_painel_acesso === true;
  temPapelDeLoja = ['loja','master_loja','master'].includes(perfil.tipo);

  if (perfil.tipo === 'master' || perfil.tipo === 'master_loja') minhasLojas = [...TODAS_LOJAS];
  else if (perfil.lojas && perfil.lojas.length) minhasLojas = perfil.lojas;
  else if (perfil.loja) minhasLojas = [perfil.loja];
  else minhasLojas = [];

  if (temPapelDeLoja && minhasLojas.length) {
    const sel = $('seletorLoja');
    sel.innerHTML = minhasLojas.map(l => '<option value="'+esc(l)+'">'+esc(l)+'</option>').join('');
    lojaAtual = minhasLojas[0];
    $('seletorLojaWrap').style.display = '';
  } else {
    temPapelDeLoja = false;
  }

  if (temPapelDeLoja) {
    $('tabContagem').style.display = '';
    $('tabHistorico').style.display = '';
  }
  if (souGerencial) {
    $('tabHistorico').style.display = '';
    $('tabRelatorio').style.display = '';
    $('tabInsumos').style.display = '';
    $('tabCDLuna').style.display = '';
  }
  if (souPainelCentral) {
    $('tabPainelCentral').style.display = '';
  }

  currentTab = temPapelDeLoja ? 'contagem' : (souPainelCentral ? 'painelcentral' : (souGerencial ? 'relatorio' : 'historico'));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===currentTab));

  await carregarCatalogo();

  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('carregandoOverlay').remove();
  renderTab();
}

function onTrocarLoja(){
  lojaAtual = $('seletorLoja').value;
  contagemAtiva = null;
  renderTab();
}

function mudarTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab));
  fecharSidebar();
  renderTab();
}

function renderTab(){
  const fns = { contagem: renderContagem, historico: renderHistorico, relatorio: renderRelatorio, insumos: renderInsumos, cdluna: renderCDLuna, painelcentral: renderPainelCentral };
  (fns[currentTab] || renderContagem)();
}

// ── CATÁLOGO (Gelato/Pote/Confeitaria/Picolé vem da Precificação; as demais
// categorias são gerenciáveis dentro do próprio módulo, em "Categorias e Itens") ──
async function carregarCatalogo(){
  const { data: categorias } = await sb.from('inventario_categorias').select('*').eq('ativo', true).order('ordem').order('nome');
  // Categorias que começam com "CD " são exclusivas da contagem do CD Luna —
  // não entram na contagem das lojas.
  categoriasDinamicasCache = (categorias || []).filter(c => !c.nome.startsWith('CD '));
  ORDEM_CATEGORIAS = [...CATEGORIAS_PRECIFICACAO, ...categoriasDinamicasCache.map(c => c.nome)];

  catalogoCache = {};
  ORDEM_CATEGORIAS.forEach(c => catalogoCache[c] = []);

  const { data: precif, error: errPrecif } = await sb.from('precificacao_produtos')
    .select('id, nome, categoria, ativo, origem')
    .in('categoria', CATEGORIAS_PRECIFICACAO)
    .order('nome');
  if (!errPrecif && precif) {
    precif.forEach(p => {
      // "consumo_loja" é produto montado na loja na hora (ex: Cascão 3 bolas,
      // Copinho, Casquinha) — não é item de estoque físico contável, então
      // nunca entra na contagem, seja qual for a categoria.
      if (p.origem === 'consumo_loja') return;
      // Considera gelatos inativos também (pode haver estoque de sabor descontinuado);
      // demais categorias, só ativos.
      if (p.ativo || p.categoria === 'Gelato') {
        catalogoCache[p.categoria].push({ id: p.id, nome: p.nome, ativo: p.ativo, unidade: p.categoria === 'Gelato' ? 'caixa' : 'unid.' });
      }
    });
  }

  if (categoriasDinamicasCache.length) {
    const { data: itens, error: errItens } = await sb.from('inventario_itens_catalogo')
      .select('*').eq('ativo', true).order('ordem').order('nome');
    if (!errItens && itens) {
      const porCategoriaId = {};
      categoriasDinamicasCache.forEach(c => { porCategoriaId[c.id] = c.nome; });
      itens.forEach(i => {
        const nomeCategoria = porCategoriaId[i.categoria_id];
        if (nomeCategoria) catalogoCache[nomeCategoria].push({ id: i.id, nome: i.nome, ativo: true, unidade: i.unidade });
      });
    }
  }
}

function catalogoTemItens(){
  return ORDEM_CATEGORIAS.some(c => catalogoCache[c] && catalogoCache[c].length);
}

// ── ABA: NOVA CONTAGEM ────────────────────────────────────
async function renderContagem(){
  const el = $('mainContent');
  if (!lojaAtual) { el.innerHTML = '<div class="empty">Selecione uma loja.</div>'; return; }
  el.innerHTML = '<div class="loading">Carregando…</div>';

  const hojeStr = hojeISO();
  const ref = calcularDiaReferencia();

  const { data: existenteHoje } = await sb.from('inventario_contagens')
    .select('*').eq('loja', lojaAtual).eq('data_contagem', hojeStr).maybeSingle();

  // Se não tem nada hoje ainda, mas o dia de referência é ontem (dentro da
  // tolerância de 1 dia) e a de ontem não foi finalizada, continua nela.
  let alvo = existenteHoje;
  if (!alvo && ref.iso !== hojeStr) {
    const { data: existenteOntem } = await sb.from('inventario_contagens')
      .select('*').eq('loja', lojaAtual).eq('data_contagem', ref.iso).maybeSingle();
    if (existenteOntem && existenteOntem.status !== 'finalizada') alvo = existenteOntem;
  }
  // Rede de segurança: se ainda não achou nada (ex: já passou mais de 1 dia
  // desde a última tentativa), procura qualquer contagem em andamento dessa
  // loja, não importa a data — evita "perder" uma contagem com item já salvo
  // e criar uma nova do zero por engano.
  if (!alvo) {
    const { data: qualquerEmAndamento } = await sb.from('inventario_contagens')
      .select('*').eq('loja', lojaAtual).eq('status', 'em_andamento')
      .order('data_contagem', { ascending: false }).limit(1).maybeSingle();
    if (qualquerEmAndamento) alvo = qualquerEmAndamento;
  }

  let bannerHtml = '';
  if (ref.programado) {
    bannerHtml = `<div class="alert-banner ok"><h4>📅 Dia de contagem</h4>${ref.motivo}.</div>`;
  } else if (ref.semanalDispensada) {
    bannerHtml = `<div class="alert-banner info"><h4>📅 Semana de contagem mensal</h4>${ref.motivo}.</div>`;
  } else {
    bannerHtml = `<div class="alert-banner warn"><h4>Hoje não é um dia programado</h4>A contagem é semanal (terças-feiras), com uma contagem adicional no último dia do mês — e pode ser enviada até o dia seguinte ao dia de referência. Você ainda pode registrar uma contagem hoje se precisar.</div>`;
  }

  if (alvo && alvo.status === 'finalizada') {
    const horasDesde = (Date.now() - new Date(alvo.finalizado_em).getTime()) / 3600000;
    if (horasDesde <= 48) {
      contagemAtiva = alvo;
      const prazoFinal = new Date(new Date(alvo.finalizado_em).getTime() + 48*3600000);
      el.innerHTML = `<div class="card">
        <h2>Revisar Contagem — ${esc(lojaAtual)}</h2>
        <div class="alert-banner info"><h4>✏️ Ainda dentro do prazo de revisão</h4>A contagem de ${fmtData(alvo.data_contagem)} já foi enviada, mas você pode corrigir os itens até ${fmtDataHora(prazoFinal.toISOString())} (48h após o envio). Depois disso, ela é bloqueada.</div>
        <div id="contFormulario"></div>
      </div>`;
      await carregarFormularioContagem(true);
      return;
    }
    el.innerHTML = `<div class="card">${bannerHtml}
      <h2>Nova Contagem — ${esc(lojaAtual)}</h2>
      <div class="alert-banner info"><h4>🔒 Contagem bloqueada pra edição</h4>A contagem de ${fmtData(alvo.data_contagem)} (${alvo.tipo === 'mensal' ? 'mensal' : 'semanal'}) foi finalizada em ${fmtDataHora(alvo.finalizado_em)} — o prazo de 48h pra revisão já passou. Consulte no Histórico.</div>
      <button class="btn" onclick="mudarTab('historico')">Ver no Histórico</button>
    </div>`;
    return;
  }

  contagemAtiva = alvo || null;
  const dataDefault = ref.iso;
  const tipoDefault = ref.tipo || 'semanal';

  el.innerHTML = `<div class="card">
    ${bannerHtml}
    <h2>Nova Contagem — ${esc(lojaAtual)}</h2>
    <p class="hint">Pese/conte os itens fisicamente na loja e registre aqui. Você pode salvar parcialmente e continuar depois.</p>
    <div class="row">
      <div class="field"><label>Data da contagem</label><input type="date" class="inp" id="contData" value="${alvo ? alvo.data_contagem : dataDefault}" ${alvo ? 'disabled' : ''}></div>
      <div class="field"><label>Tipo</label>
        <select class="inp" id="contTipo" ${alvo ? 'disabled' : ''}>
          <option value="semanal" ${(alvo ? alvo.tipo==='semanal' : tipoDefault==='semanal')?'selected':''}>Semanal</option>
          <option value="mensal" ${(alvo ? alvo.tipo==='mensal' : tipoDefault==='mensal')?'selected':''}>Mensal (fim de mês)</option>
        </select>
      </div>
      ${!alvo ? '<button class="btn" onclick="iniciarContagem()">Iniciar Contagem</button>' : ''}
    </div>
    <div id="contFormulario"></div>
  </div>`;

  if (alvo) {
    await carregarFormularioContagem();
  }
}

async function iniciarContagem(){
  const data = $('contData').value;
  const tipo = $('contTipo').value;
  if (!data) { alert('Selecione a data.'); return; }

  const { data: nova, error } = await sb.from('inventario_contagens').insert({
    loja: lojaAtual, data_contagem: data, tipo,
    criado_por: meuPerfil.id, criado_por_nome: meuPerfil.nome
  }).select('*').single();

  if (error) {
    if (error.message.includes('duplicate') || error.code === '23505') {
      alert('Já existe uma contagem para esta loja nesta data. Recarregando…');
      renderContagem();
      return;
    }
    alert('Erro ao iniciar contagem: ' + error.message);
    return;
  }
  contagemAtiva = nova;
  renderContagem();
}

async function carregarFormularioContagem(modoRevisao){
  const wrap = $('contFormulario');
  wrap.innerHTML = '<div class="loading">Carregando itens…</div>';

  // Itens já lançados nesta contagem (rascunho)
  const { data: itensExistentes } = await sb.from('inventario_itens').select('*').eq('contagem_id', contagemAtiva.id);
  itensAtuais = {};
  (itensExistentes || []).forEach(i => {
    const id = i.precificacao_produto_id || i.insumo_id;
    itensAtuais[chaveItem(i.categoria, id)] = { quantidade: i.quantidade, replicado: i.replicado_anterior };
  });

  // Última contagem finalizada anterior a esta, pra permitir "repetir"
  const { data: anteriorHead } = await sb.from('inventario_contagens')
    .select('id').eq('loja', lojaAtual).eq('status', 'finalizada')
    .lt('data_contagem', contagemAtiva.data_contagem)
    .order('data_contagem', { ascending: false }).limit(1).maybeSingle();

  itensAnteriores = {};
  if (anteriorHead) {
    const { data: itensAnt } = await sb.from('inventario_itens').select('*').eq('contagem_id', anteriorHead.id);
    (itensAnt || []).forEach(i => {
      const id = i.precificacao_produto_id || i.insumo_id;
      itensAnteriores[chaveItem(i.categoria, id)] = i.quantidade;
    });
  }

  if (!catalogoTemItens()) {
    wrap.innerHTML = '<div class="empty">Nenhum item cadastrado ainda (verifique a Precificação e a lista de Insumos).</div>';
    return;
  }

  let html = '';
  ORDEM_CATEGORIAS.forEach(cat => {
    const itens = catalogoCache[cat] || [];
    if (!itens.length) return;
    const temAnteriorNaCategoria = itens.some(it => itensAnteriores[chaveItem(cat, it.id)] !== undefined);
    html += `<div class="categoria-titulo"><span>${esc(cat)}</span>
      ${temAnteriorNaCategoria ? `<button class="cat-repetir" onclick="repetirCategoria('${esc(cat)}')">🔁 Repetir tudo da anterior</button>` : ''}
    </div>`;
    itens.forEach(it => {
      const chave = chaveItem(cat, it.id);
      const atual = itensAtuais[chave];
      const anterior = itensAnteriores[chave];
      html += `<div class="item-row" data-chave="${esc(chave)}">
        <div class="item-nome">${esc(it.nome)}${!it.ativo ? '<span class="item-inativo-tag">inativo</span>' : ''}</div>
        <div class="item-anterior">${anterior !== undefined ? 'ant.: ' + Number(anterior) : ''}</div>
        <button type="button" class="item-repetir" title="Repetir valor anterior" onclick="repetirItem('${esc(chave)}')" ${anterior===undefined?'disabled':''}>🔁</button>
        <input type="number" min="0" step="0.01" class="item-qtd${atual&&atual.replicado?' replicado':''}" value="${atual ? atual.quantidade : ''}" data-cat="${esc(cat)}" data-id="${esc(String(it.id))}">
        <span class="item-unid">${esc(it.unidade||'')}</span>
      </div>`;
    });
  });

  wrap.innerHTML = html + (modoRevisao ? `
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
      <button class="btn" onclick="salvarCorrecoes()">💾 Salvar Correções</button>
    </div>
    <div id="contMsg" class="msg"></div>` : `
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
      <button class="btn btn-outline" onclick="salvarRascunho()">Salvar e Continuar Depois</button>
      <button class="btn" onclick="finalizarContagem()">Finalizar Contagem</button>
    </div>
    <div id="contMsg" class="msg"></div>`);
}

async function salvarCorrecoes(){
  const linhas = coletarLinhasFormulario();
  const btn = document.querySelector('#contFormulario button.btn');
  btn.disabled = true; btn.textContent = 'Salvando…';
  const error = await salvarLinhas(linhas);
  btn.disabled = false; btn.textContent = '💾 Salvar Correções';
  if (error) { showMsg('contMsg', 'Erro ao salvar: ' + error.message, 'err'); return; }
  showMsg('contMsg', 'Correções salvas!', 'ok');
}

function repetirItem(chave){
  const row = document.querySelector(`.item-row[data-chave="${CSS.escape(chave)}"]`);
  if (!row) return;
  const valor = itensAnteriores[chave];
  if (valor === undefined) return;
  const input = row.querySelector('.item-qtd');
  input.value = Number(valor);
  input.classList.add('replicado');
}

function repetirCategoria(cat){
  document.querySelectorAll(`.item-row input.item-qtd[data-cat="${CSS.escape(cat)}"]`).forEach(input => {
    const row = input.closest('.item-row');
    const chave = row.dataset.chave;
    const valor = itensAnteriores[chave];
    if (valor !== undefined && !input.value) {
      input.value = Number(valor);
      input.classList.add('replicado');
    }
  });
}

function coletarLinhasFormulario(){
  return [...document.querySelectorAll('#contFormulario .item-row')].map(row => {
    const input = row.querySelector('.item-qtd');
    return {
      chave: row.dataset.chave,
      categoria: input.dataset.cat,
      id: input.dataset.id,
      quantidade: input.value === '' ? null : parseFloat(input.value),
      replicado: input.classList.contains('replicado')
    };
  });
}

async function salvarLinhas(linhas){
  const paraSalvar = linhas.filter(l => l.quantidade !== null && !isNaN(l.quantidade));
  for (const l of paraSalvar) {
    const item = (catalogoCache[l.categoria] || []).find(i => String(i.id) === l.id);
    const payload = {
      contagem_id: contagemAtiva.id,
      categoria: l.categoria,
      nome_produto: item ? item.nome : l.id,
      unidade: item ? item.unidade : null,
      quantidade: l.quantidade,
      replicado_anterior: l.replicado,
    };
    if (CATEGORIAS_PRECIFICACAO.includes(l.categoria)) payload.precificacao_produto_id = l.id; else payload.insumo_id = l.id;

    const conflictCol = CATEGORIAS_PRECIFICACAO.includes(l.categoria) ? 'contagem_id,precificacao_produto_id' : 'contagem_id,insumo_id';
    const { error } = await sb.from('inventario_itens').upsert(payload, { onConflict: conflictCol });
    if (error) return error;
  }
  return null;
}

async function salvarRascunho(){
  const linhas = coletarLinhasFormulario();
  const btn = document.querySelector('#contFormulario button.btn-outline');
  btn.disabled = true; btn.textContent = 'Salvando…';
  const error = await salvarLinhas(linhas);
  btn.disabled = false; btn.textContent = 'Salvar e Continuar Depois';
  if (error) { showMsg('contMsg', 'Erro ao salvar: ' + error.message, 'err'); return; }
  showMsg('contMsg', 'Rascunho salvo.', 'ok');
}

async function finalizarContagem(){
  const linhas = coletarLinhasFormulario();
  const semValor = linhas.filter(l => l.quantidade === null || isNaN(l.quantidade));
  if (semValor.length) {
    abrirModalConfirm('Itens sem valor', `${semValor.length} item(ns) ficaram sem quantidade preenchida e não vão entrar na contagem. Confirma finalizar mesmo assim?`, async () => {
      await executarFinalizacao(linhas);
    });
    return;
  }
  await executarFinalizacao(linhas);
}

async function executarFinalizacao(linhas){
  showMsg('contMsg', '', '');
  const error = await salvarLinhas(linhas);
  if (error) { showMsg('contMsg', 'Erro ao salvar: ' + error.message, 'err'); return; }

  const { error: errFinal } = await sb.from('inventario_contagens')
    .update({ status: 'finalizada', finalizado_em: new Date().toISOString() })
    .eq('id', contagemAtiva.id);
  if (errFinal) { showMsg('contMsg', 'Erro ao finalizar: ' + errFinal.message, 'err'); return; }

  contagemAtiva = null;
  renderContagem();
}

  const el = $('mainContent');
  el.innerHTML = '<div class="loading">Carregando…</div>';

  const filtroLoja = souGerencial ? `
    <div class="field"><label>Loja</label><select class="inp" id="histFiltroLoja" onchange="carregarHistoricoLista()">
      ${souGerencial ? '<option value="">Todas as lojas</option>' : ''}
      ${TODAS_LOJAS.map(l=>'<option value="'+esc(l)+'"'+(l===lojaAtual?' selected':'')+'>'+esc(l)+'</option>').join('')}
    </select></div>` : '';

  el.innerHTML = `<div class="card">
    <h2>Histórico de Contagens</h2>
    ${filtroLoja ? '<div class="row">'+filtroLoja+'</div>' : ''}
    <div id="histLista"><div class="loading">Carregando…</div></div>
  </div>
  <div id="histDetalheWrap"></div>`;

  await carregarHistoricoLista();
}

async function carregarHistoricoLista(){
  const el = $('histLista');
  el.innerHTML = '<div class="loading">Carregando…</div>';

  let query = sb.from('inventario_contagens').select('*').order('data_contagem', { ascending: false });
  if (souGerencial) {
    const filtro = $('histFiltroLoja') ? $('histFiltroLoja').value : '';
    if (filtro) query = query.eq('loja', filtro);
  } else {
    query = query.eq('loja', lojaAtual);
  }
  const { data, error } = await query.limit(100);
  if (error) { el.innerHTML = '<div class="empty">Erro: '+esc(error.message)+'</div>'; return; }
  if (!data || !data.length) { el.innerHTML = '<div class="empty">Nenhuma contagem registrada ainda.</div>'; return; }

  el.innerHTML = `<div class="table-wrap"><table>
    <tr><th>Data</th>${souGerencial ? '<th>Loja</th>' : ''}<th>Tipo</th><th>Status</th><th>Finalizada em</th><th></th></tr>
    ${data.map(c => `<tr>
      <td>${fmtData(c.data_contagem)}</td>
      ${souGerencial ? `<td>${esc(c.loja)}</td>` : ''}
      <td><span class="badge badge-${c.tipo}">${c.tipo === 'mensal' ? 'Mensal' : 'Semanal'}</span></td>
      <td><span class="badge badge-${c.status === 'finalizada' ? 'concluido' : 'andamento'}">${c.status === 'finalizada' ? 'Finalizada' : 'Em andamento'}</span></td>
      <td>${c.finalizado_em ? fmtDataHora(c.finalizado_em) : '—'}</td>
      <td><button class="btn-sm btn" onclick="verDetalheContagem(${c.id})">Ver</button></td>
    </tr>`).join('')}
  </table></div>`;
}

async function verDetalheContagem(id){
  const wrap = $('histDetalheWrap');
  wrap.innerHTML = '<div class="card"><div class="loading">Carregando…</div></div>';
  wrap.scrollIntoView({ behavior: 'smooth' });

  const { data: cont } = await sb.from('inventario_contagens').select('*').eq('id', id).single();
  const { data: itens } = await sb.from('inventario_itens').select('*').eq('contagem_id', id).order('categoria').order('nome_produto');

  if (!cont) { wrap.innerHTML = '<div class="card"><div class="empty">Contagem não encontrada.</div></div>'; return; }

  const grupos = {};
  (itens || []).forEach(i => { (grupos[i.categoria] = grupos[i.categoria] || []).push(i); });

  wrap.innerHTML = `<div class="card">
    <h2>${esc(cont.loja)} — ${fmtData(cont.data_contagem)} <span class="badge badge-${cont.tipo}">${cont.tipo === 'mensal' ? 'Mensal' : 'Semanal'}</span></h2>
    <p class="hint">Registrado por ${esc(cont.criado_por_nome||'—')} · ${cont.status === 'finalizada' ? 'Finalizada em ' + fmtDataHora(cont.finalizado_em) : 'Em andamento'}</p>
    ${Object.keys(grupos).sort((a,b)=>ORDEM_CATEGORIAS.indexOf(a)-ORDEM_CATEGORIAS.indexOf(b)).map(cat => `
      <div class="categoria-titulo"><span>${esc(cat)}</span></div>
      <div class="table-wrap"><table>
        <tr><th>Item</th><th>Quantidade</th><th>Unidade</th></tr>
        ${grupos[cat].map(i => `<tr><td>${esc(i.nome_produto)}${i.replicado_anterior ? ' <span class="badge badge-semanal">repetido</span>' : ''}</td><td>${Number(i.quantidade)}</td><td>${esc(i.unidade||'')}</td></tr>`).join('')}
      </table></div>
    `).join('') || '<div class="empty">Nenhum item registrado nesta contagem.</div>'}
    <button class="modal-close" onclick="document.getElementById('histDetalheWrap').innerHTML=''">Fechar</button>
  </div>`;
}

let ultimoPivotDados = null; // { data, itens:[{categoria,nome,unidade,porLoja:{loja:qtd}}], lojasComContagem:[], lojasSemContagem:[] }

async function gerarInventarioPorData(){
  const data = $('relDataUnica').value;
  const el = $('relPivotResultado');
  const btnExport = $('btnExportarPivot');
  if (!data) { alert('Selecione uma data.'); return; }
  el.innerHTML = '<div class="loading">Carregando…</div>';
  btnExport.style.display = 'none';

  const { data: contagens, error } = await sb.from('inventario_contagens')
    .select('*, inventario_itens(*)')
    .eq('status', 'finalizada')
    .eq('data_contagem', data);

  if (error) { el.innerHTML = '<div class="empty">Erro: '+esc(error.message)+'</div>'; return; }

  if (!contagens || !contagens.length) {
    el.innerHTML = `<div class="alert-banner warn"><h4>Nenhuma contagem finalizada</h4>Nenhuma loja finalizou uma contagem em ${fmtData(data)}.</div>`;
    ultimoPivotDados = null;
    return;
  }

  const lojasComContagem = contagens.map(c => c.loja).sort();
  const lojasSemContagem = TODAS_LOJAS.filter(l => !lojasComContagem.includes(l));

  // Monta o pivot: chave (categoria+nome) -> {categoria, nome, unidade, porLoja:{loja:qtd}}
  const mapaItens = {};
  contagens.forEach(c => {
    (c.inventario_itens || []).forEach(i => {
      const chave = i.categoria + '|' + i.nome_produto;
      if (!mapaItens[chave]) mapaItens[chave] = { categoria: i.categoria, nome: i.nome_produto, unidade: i.unidade, porLoja: {} };
      mapaItens[chave].porLoja[c.loja] = Number(i.quantidade);
    });
  });

  const itens = Object.values(mapaItens).sort((a, b) => {
    const ordA = ORDEM_CATEGORIAS.indexOf(a.categoria), ordB = ORDEM_CATEGORIAS.indexOf(b.categoria);
    if (ordA !== ordB) return ordA - ordB;
    return a.nome.localeCompare(b.nome);
  });

  ultimoPivotDados = { data, itens, lojasComContagem, lojasSemContagem };

  let html = '';
  if (lojasSemContagem.length) {
    html += `<div class="alert-banner warn"><h4>⚠️ Lojas sem contagem finalizada nesta data</h4>${lojasSemContagem.map(esc).join(', ')}</div>`;
  }

  html += `<div class="table-wrap"><table>
    <tr><th>Categoria</th><th>Item</th>${lojasComContagem.map(l => `<th>${esc(l)}</th>`).join('')}<th>Total</th></tr>
    ${itens.map(it => {
      const total = lojasComContagem.reduce((s, l) => s + (it.porLoja[l] || 0), 0);
      return `<tr><td>${esc(it.categoria)}</td><td>${esc(it.nome)}${it.unidade ? ' <span style="color:var(--text-light);font-size:.72rem">('+esc(it.unidade)+')</span>' : ''}</td>
        ${lojasComContagem.map(l => `<td>${it.porLoja[l] !== undefined ? it.porLoja[l] : '—'}</td>`).join('')}
        <td><strong>${total}</strong></td>
      </tr>`;
    }).join('')}
  </table></div>`;

  el.innerHTML = html;
  btnExport.style.display = '';
}

function exportarInventarioPorDataCSV(){
  if (!ultimoPivotDados) { alert('Gere o inventário antes de exportar.'); return; }
  const { data, itens, lojasComContagem } = ultimoPivotDados;
  const esc2 = v => `"${String(v).replace(/"/g, '""')}"`;
  const linhas = [['Categoria','Item','Unidade', ...lojasComContagem, 'Total'].map(esc2).join(',')];
  itens.forEach(it => {
    const total = lojasComContagem.reduce((s, l) => s + (it.porLoja[l] || 0), 0);
    linhas.push([it.categoria, it.nome, it.unidade||'', ...lojasComContagem.map(l => it.porLoja[l] !== undefined ? it.porLoja[l] : ''), total].map(esc2).join(','));
  });
  const csv = '\uFEFF' + linhas.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `inventario-completo-${data}.csv`;
  a.click();
}

// ── CD LUNA (contagem própria, catálogo vem do módulo Estoque CD Luna) ────
const LOJA_CD = 'CD Luna';
let cdCatalogoCache = {};
let cdOrdemCategorias = [];
let cdContagemAtiva = null;
let cdItensAtuais = {};
let cdItensAnteriores = {};
let cdMostrandoHistorico = false;

async function carregarCatalogoCD(){
  const { data: categorias } = await sb.from('inventario_categorias').select('*').eq('ativo', true).like('nome', 'CD %').order('ordem').order('nome');
  cdCatalogoCache = {};
  cdOrdemCategorias = (categorias || []).map(c => c.nome.replace(/^CD /, ''));
  if (!categorias || !categorias.length) return;

  const idsCategorias = categorias.map(c => c.id);
  const nomePorId = {};
  categorias.forEach(c => { nomePorId[c.id] = c.nome.replace(/^CD /, ''); });

  const { data: itens, error } = await sb.from('inventario_itens_catalogo').select('*').in('categoria_id', idsCategorias).eq('ativo', true).order('ordem').order('nome');
  if (error || !itens) return;
  itens.forEach(i => {
    const cat = nomePorId[i.categoria_id];
    (cdCatalogoCache[cat] = cdCatalogoCache[cat] || []).push({ id: i.id, nome: i.nome, unidade: i.unidade });
  });
}

async function renderCDLuna(){
  const el = $('mainContent');
  el.innerHTML = '<div class="loading">Carregando…</div>';

  if (!cdOrdemCategorias.length) await carregarCatalogoCD();

  if (cdMostrandoHistorico) { await renderHistoricoCD(); return; }

  const hojeStr = hojeISO();
  const ref = calcularDiaReferencia();

  const { data: existenteHoje } = await sb.from('inventario_contagens')
    .select('*').eq('loja', LOJA_CD).eq('data_contagem', hojeStr).maybeSingle();

  let alvo = existenteHoje;
  if (!alvo && ref.iso !== hojeStr) {
    const { data: existenteOntem } = await sb.from('inventario_contagens')
      .select('*').eq('loja', LOJA_CD).eq('data_contagem', ref.iso).maybeSingle();
    if (existenteOntem && existenteOntem.status !== 'finalizada') alvo = existenteOntem;
  }
  if (!alvo) {
    const { data: qualquerEmAndamento } = await sb.from('inventario_contagens')
      .select('*').eq('loja', LOJA_CD).eq('status', 'em_andamento')
      .order('data_contagem', { ascending: false }).limit(1).maybeSingle();
    if (qualquerEmAndamento) alvo = qualquerEmAndamento;
  }

  let bannerHtml = '';
  if (ref.programado) {
    bannerHtml = `<div class="alert-banner ok"><h4>📅 Dia de contagem</h4>${ref.motivo}.</div>`;
  } else if (ref.semanalDispensada) {
    bannerHtml = `<div class="alert-banner info"><h4>📅 Semana de contagem mensal</h4>${ref.motivo}.</div>`;
  } else {
    bannerHtml = `<div class="alert-banner warn"><h4>Hoje não é um dia programado</h4>A contagem é semanal (terças-feiras), com uma contagem adicional no último dia do mês — e pode ser enviada até o dia seguinte ao dia de referência. Você ainda pode registrar uma contagem hoje se precisar.</div>`;
  }

  const cabecalho = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0">Contagem — CD Luna</h2>
      <button class="rank-btn rank-btn-ghost" onclick="cdMostrandoHistorico=true; renderCDLuna()">📜 Ver histórico do CD Luna</button>
    </div>`;

  if (alvo && alvo.status === 'finalizada') {
    const horasDesde = (Date.now() - new Date(alvo.finalizado_em).getTime()) / 3600000;
    if (horasDesde <= 48) {
      cdContagemAtiva = alvo;
      const prazoFinal = new Date(new Date(alvo.finalizado_em).getTime() + 48*3600000);
      el.innerHTML = `<div class="card">${cabecalho}
        <div class="alert-banner info"><h4>✏️ Ainda dentro do prazo de revisão</h4>A contagem de ${fmtData(alvo.data_contagem)} já foi enviada, mas você pode corrigir os itens até ${fmtDataHora(prazoFinal.toISOString())} (48h após o envio).</div>
        <div id="cdContFormulario"></div>
      </div>`;
      await carregarFormularioContagemCD(true);
      return;
    }
    el.innerHTML = `<div class="card">${cabecalho}${bannerHtml}
      <div class="alert-banner info"><h4>🔒 Contagem bloqueada pra edição</h4>A contagem de ${fmtData(alvo.data_contagem)} (${alvo.tipo === 'mensal' ? 'mensal' : 'semanal'}) foi finalizada em ${fmtDataHora(alvo.finalizado_em)} — o prazo de 48h pra revisão já passou.</div>
    </div>`;
    return;
  }

  cdContagemAtiva = alvo || null;
  const dataDefault = ref.iso;
  const tipoDefault = ref.tipo || 'semanal';

  el.innerHTML = `<div class="card">
    ${cabecalho}
    ${bannerHtml}
    <p class="hint">Itens do CD Luna (Confeitaria, Embalagem, Uniformes, Variegatos, Produção, Outros — conforme o cadastro do Estoque CD Luna). Você pode salvar parcialmente e continuar depois.</p>
    <div class="row">
      <div class="field"><label>Data da contagem</label><input type="date" class="inp" id="cdContData" value="${alvo ? alvo.data_contagem : dataDefault}" ${alvo ? 'disabled' : ''}></div>
      <div class="field"><label>Tipo</label>
        <select class="inp" id="cdContTipo" ${alvo ? 'disabled' : ''}>
          <option value="semanal" ${(alvo ? alvo.tipo==='semanal' : tipoDefault==='semanal')?'selected':''}>Semanal</option>
          <option value="mensal" ${(alvo ? alvo.tipo==='mensal' : tipoDefault==='mensal')?'selected':''}>Mensal (fim de mês)</option>
        </select>
      </div>
      ${!alvo ? '<button class="btn" onclick="iniciarContagemCD()">Iniciar Contagem</button>' : ''}
    </div>
    <div id="cdContFormulario"></div>
  </div>`;

  if (alvo) await carregarFormularioContagemCD();
}

async function iniciarContagemCD(){
  const data = $('cdContData').value;
  const tipo = $('cdContTipo').value;
  if (!data) { alert('Selecione a data.'); return; }

  const { data: nova, error } = await sb.from('inventario_contagens').insert({
    loja: LOJA_CD, data_contagem: data, tipo,
    criado_por: meuPerfil.id, criado_por_nome: meuPerfil.nome
  }).select('*').single();

  if (error) {
    if (error.message.includes('duplicate') || error.code === '23505') {
      alert('Já existe uma contagem do CD Luna nesta data. Recarregando…');
      renderCDLuna();
      return;
    }
    alert('Erro ao iniciar contagem: ' + error.message);
    return;
  }
  cdContagemAtiva = nova;
  renderCDLuna();
}

async function carregarFormularioContagemCD(modoRevisao){
  const wrap = $('cdContFormulario');
  wrap.innerHTML = '<div class="loading">Carregando itens…</div>';

  const { data: itensExistentes } = await sb.from('inventario_itens').select('*').eq('contagem_id', cdContagemAtiva.id);
  cdItensAtuais = {};
  (itensExistentes || []).forEach(i => {
    cdItensAtuais[chaveItem(i.categoria, i.insumo_id)] = { quantidade: i.quantidade, replicado: i.replicado_anterior };
  });

  const { data: anteriorHead } = await sb.from('inventario_contagens')
    .select('id').eq('loja', LOJA_CD).eq('status', 'finalizada')
    .lt('data_contagem', cdContagemAtiva.data_contagem)
    .order('data_contagem', { ascending: false }).limit(1).maybeSingle();

  cdItensAnteriores = {};
  if (anteriorHead) {
    const { data: itensAnt } = await sb.from('inventario_itens').select('*').eq('contagem_id', anteriorHead.id);
    (itensAnt || []).forEach(i => {
      cdItensAnteriores[chaveItem(i.categoria, i.insumo_id)] = i.quantidade;
    });
  }

  if (!cdOrdemCategorias.length) {
    wrap.innerHTML = '<div class="empty">Nenhum item cadastrado no Estoque CD Luna ainda.</div>';
    return;
  }

  let html = '';
  cdOrdemCategorias.forEach(cat => {
    const itens = cdCatalogoCache[cat] || [];
    if (!itens.length) return;
    const temAnteriorNaCategoria = itens.some(it => cdItensAnteriores[chaveItem(cat, it.id)] !== undefined);
    html += `<div class="categoria-titulo"><span>${esc(cat)}</span>
      ${temAnteriorNaCategoria ? `<button class="cat-repetir" onclick="repetirCategoriaCD('${esc(cat)}')">🔁 Repetir tudo da anterior</button>` : ''}
    </div>`;
    itens.forEach(it => {
      const chave = chaveItem(cat, it.id);
      const atual = cdItensAtuais[chave];
      const anterior = cdItensAnteriores[chave];
      html += `<div class="item-row" data-chave="${esc(chave)}">
        <div class="item-nome">${esc(it.nome)}</div>
        <div class="item-anterior">${anterior !== undefined ? 'ant.: ' + Number(anterior) : ''}</div>
        <button type="button" class="item-repetir" title="Repetir valor anterior" onclick="repetirItemCD('${esc(chave)}')" ${anterior===undefined?'disabled':''}>🔁</button>
        <input type="number" min="0" step="0.01" class="item-qtd${atual&&atual.replicado?' replicado':''}" value="${atual ? atual.quantidade : ''}" data-cat="${esc(cat)}" data-id="${esc(String(it.id))}">
        <span class="item-unid">${esc(it.unidade||'')}</span>
      </div>`;
    });
  });

  wrap.innerHTML = html + (modoRevisao ? `
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
      <button class="btn" onclick="salvarCorrecoesCD()">💾 Salvar Correções</button>
    </div>
    <div id="cdContMsg" class="msg"></div>` : `
    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
      <button class="btn btn-outline" onclick="salvarRascunhoCD()">Salvar e Continuar Depois</button>
      <button class="btn" onclick="finalizarContagemCD()">Finalizar Contagem</button>
    </div>
    <div id="cdContMsg" class="msg"></div>`);
}

async function salvarCorrecoesCD(){
  const linhas = coletarLinhasFormularioCD();
  const btn = document.querySelector('#cdContFormulario button.btn');
  btn.disabled = true; btn.textContent = 'Salvando…';
  const error = await salvarLinhasCD(linhas);
  btn.disabled = false; btn.textContent = '💾 Salvar Correções';
  if (error) { showMsg('cdContMsg', 'Erro ao salvar: ' + error.message, 'err'); return; }
  showMsg('cdContMsg', 'Correções salvas!', 'ok');
}

function repetirItemCD(chave){
  const row = document.querySelector(`#cdContFormulario .item-row[data-chave="${CSS.escape(chave)}"]`);
  if (!row) return;
  const valor = cdItensAnteriores[chave];
  if (valor === undefined) return;
  const input = row.querySelector('.item-qtd');
  input.value = Number(valor);
  input.classList.add('replicado');
}

function repetirCategoriaCD(cat){
  document.querySelectorAll(`#cdContFormulario .item-row input.item-qtd[data-cat="${CSS.escape(cat)}"]`).forEach(input => {
    const row = input.closest('.item-row');
    const chave = row.dataset.chave;
    const valor = cdItensAnteriores[chave];
    if (valor !== undefined && !input.value) {
      input.value = Number(valor);
      input.classList.add('replicado');
    }
  });
}

function coletarLinhasFormularioCD(){
  return [...document.querySelectorAll('#cdContFormulario .item-row')].map(row => {
    const input = row.querySelector('.item-qtd');
    return {
      categoria: input.dataset.cat,
      id: input.dataset.id,
      quantidade: input.value === '' ? null : parseFloat(input.value),
      replicado: input.classList.contains('replicado')
    };
  });
}

async function salvarLinhasCD(linhas){
  const paraSalvar = linhas.filter(l => l.quantidade !== null && !isNaN(l.quantidade));
  for (const l of paraSalvar) {
    const item = (cdCatalogoCache[l.categoria] || []).find(i => String(i.id) === l.id);
    const payload = {
      contagem_id: cdContagemAtiva.id,
      categoria: l.categoria,
      nome_produto: item ? item.nome : String(l.id),
      unidade: item ? item.unidade : null,
      quantidade: l.quantidade,
      replicado_anterior: l.replicado,
      insumo_id: l.id,
    };
    const { error } = await sb.from('inventario_itens').upsert(payload, { onConflict: 'contagem_id,insumo_id' });
    if (error) return error;
  }
  return null;
}

async function salvarRascunhoCD(){
  const linhas = coletarLinhasFormularioCD();
  const btn = document.querySelector('#cdContFormulario button.btn-outline');
  btn.disabled = true; btn.textContent = 'Salvando…';
  const error = await salvarLinhasCD(linhas);
  btn.disabled = false; btn.textContent = 'Salvar e Continuar Depois';
  if (error) { showMsg('cdContMsg', 'Erro ao salvar: ' + error.message, 'err'); return; }
  showMsg('cdContMsg', 'Rascunho salvo.', 'ok');
}

async function finalizarContagemCD(){
  const linhas = coletarLinhasFormularioCD();
  const semValor = linhas.filter(l => l.quantidade === null || isNaN(l.quantidade));
  if (semValor.length) {
    abrirModalConfirm('Itens sem valor', `${semValor.length} item(ns) ficaram sem quantidade preenchida e não vão entrar na contagem. Confirma finalizar mesmo assim?`, async () => {
      await executarFinalizacaoCD(linhas);
    });
    return;
  }
  await executarFinalizacaoCD(linhas);
}

async function executarFinalizacaoCD(linhas){
  showMsg('cdContMsg', '', '');
  const error = await salvarLinhasCD(linhas);
  if (error) { showMsg('cdContMsg', 'Erro ao salvar: ' + error.message, 'err'); return; }

  const { error: errFinal } = await sb.from('inventario_contagens')
    .update({ status: 'finalizada', finalizado_em: new Date().toISOString() })
    .eq('id', cdContagemAtiva.id);
  if (errFinal) { showMsg('cdContMsg', 'Erro ao finalizar: ' + errFinal.message, 'err'); return; }

  cdContagemAtiva = null;
  renderCDLuna();
}

    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">

      <td>${c.finalizado_em ? fmtDataHora(c.finalizado_em) : '—'}</td>

// ── PAINEL CENTRAL (só master, Jussara e Felipe) ──────────
// Visão consolidada: status de contagem por loja numa data, itens com
// estoque baixo/zerado (por loja ou consolidado), e busca por item
// mostrando o status daquele item em todas as lojas.
let painelData = hojeISO();
let painelModoEstoque = 'consolidado';
let painelLojaSelecionada = TODAS_LOJAS[0];
let painelEstoqueMinimoCache = {};
let painelItensCacheData = null; // cache dos itens carregados pra data atual (evita rebuscar 2x)

async function renderPainelCentral(){
  const el = $('mainContent');
  el.innerHTML = `

      <h2>Painel Central</h2>

        <div class="field"><label>Data de referência</label><input type="date" class="inp" id="painelDataInput" value="${painelData}" onchange="onMudarPainelData()"></div>

    <div class="card">
      <h2 style="font-size:1.1rem">📋 Status de contagem — ${fmtData(painelData)}</h2>

    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">

          </select>
        </div>
      </div>
      <p class="hint">"Zerado" é automático (quantidade = 0). "Baixo" depende de um mínimo definido por item — defina ao lado de cada item na lista.</p>
      <div id="painelEstoqueBaixo"><div class="loading">Carregando…</div></div>

    <div class="card">

      <div id="painelBuscaResultado"></div>

        <button class="btn-outline btn btn-sm" onclick="exportarValorizacaoPainelCSV()">⬇ Exportar CSV</button>
      </div>
      <p class="hint">Custo unitário puxado da Precificação — Loja (elo Fábrica → Loja) pra Gelato/Pote/Confeitaria/Picolé, e do Estoque CD Luna pros itens de lá. Insumo/Bebidas/Variegatos ainda não têm custo cadastrado nesses cadastros — aparecem como "sem custo".</p>

function onMudarPainelData(){
  painelData = $('painelDataInput').value;
  renderPainelCentral();
}
function onMudarModoEstoque(){
  painelModoEstoque = $('painelModoEstoqueSelect').value;
  $('painelLojaEstoqueSelect').style.display = painelModoEstoque === 'loja' ? '' : 'none';
  renderEstoqueBaixoPainel();
}
function onMudarLojaEstoque(){
  painelLojaSelecionada = $('painelLojaEstoqueSelect').value;
  renderEstoqueBaixoPainel();
}

async function carregarStatusLojasPainel(){
  const el = $('painelStatusLojas');
  const { data, error } = await sb.from('inventario_contagens').select('*').eq('data_contagem', painelData).in('loja', TODAS_LOJAS);
  if (error) { el.innerHTML = '<div class="empty">Erro: '+esc(error.message)+'</div>'; return; }

  const porLoja = {};
  (data||[]).forEach(c => { porLoja[c.loja] = c; });

  const linhas = TODAS_LOJAS.map(loja => {
    const c = porLoja[loja];
    let statusLabel, statusClass;
    if (!c) { statusLabel = 'Não iniciada'; statusClass = 'naoiniciada'; }
    else if (c.status === 'finalizada') { statusLabel = 'Finalizada'; statusClass = 'concluido'; }
    else { statusLabel = 'Em andamento'; statusClass = 'andamento'; }
    return { loja, c, statusLabel, statusClass };
  }).sort((a,b) => {
    const ordem = { naoiniciada: 0, andamento: 1, concluido: 2 };
    return ordem[a.statusClass] - ordem[b.statusClass] || a.loja.localeCompare(b.loja);
  });

  el.innerHTML = `<div class="table-wrap"><table>
    <tr><th>Loja</th><th>Status</th><th>Tipo</th><th>Finalizada em</th></tr>
    ${linhas.map(l => `<tr>
      <td>${esc(l.loja)}</td>
      <td><span class="badge badge-${l.statusClass}">${l.statusLabel}</span></td>
      <td>${l.c ? '<span class="badge badge-'+l.c.tipo+'">'+(l.c.tipo==='mensal'?'Mensal':'Semanal')+'</span>' : '—'}</td>
      <td>${l.c && l.c.finalizado_em ? fmtDataHora(l.c.finalizado_em) : '—'}</td>
    </tr>`).join('')}
  </table></div>`;
}

async function carregarDadosEstoquePainel(){
  const { data: contagens } = await sb.from('inventario_contagens').select('id, loja, status').eq('data_contagem', painelData).in('loja', TODAS_LOJAS);
  const contagemIds = (contagens||[]).map(c => c.id);
  const contagemPorId = {};
  (contagens||[]).forEach(c => { contagemPorId[c.id] = c; });

  let itens = [];
  if (contagemIds.length) {
    const { data } = await sb.from('inventario_itens').select('*').in('contagem_id', contagemIds);
    itens = (data||[]).map(i => ({ ...i, loja: contagemPorId[i.contagem_id].loja, statusContagem: contagemPorId[i.contagem_id].status }));
  }
  painelItensCacheData = itens;
}

async function carregarEstoqueMinimoPainel(){
  const { data } = await sb.from('inventario_estoque_minimo').select('*');
  painelEstoqueMinimoCache = {};
  (data||[]).forEach(m => { painelEstoqueMinimoCache[m.categoria+':'+m.item_id] = m.estoque_minimo; });
}

function renderEstoqueBaixoPainel(){
  const el = $('painelEstoqueBaixo');
  if (!painelItensCacheData) { el.innerHTML = '<div class="loading">Carregando…</div>'; return; }

  const itensFiltrados = painelModoEstoque === 'loja'
    ? painelItensCacheData.filter(i => i.loja === painelLojaSelecionada)
    : painelItensCacheData;

  const linhas = itensFiltrados.map(i => {
    const itemId = i.precificacao_produto_id || i.insumo_id;
    const chave = itemId ? (i.categoria+':'+itemId) : null;
    const minimo = chave && painelEstoqueMinimoCache[chave] !== undefined ? Number(painelEstoqueMinimoCache[chave]) : null;
    const zerado = Number(i.quantidade) === 0;
    const baixo = !zerado && minimo !== null && minimo > 0 && Number(i.quantidade) < minimo;
    return { ...i, itemId, chave, minimo, zerado, baixo };
  }).filter(i => i.zerado || i.baixo)
    .sort((a,b) => (a.zerado===b.zerado ? 0 : (a.zerado ? -1 : 1)) || a.loja.localeCompare(b.loja) || a.nome_produto.localeCompare(b.nome_produto));

  if (!linhas.length){
    el.innerHTML = '<div class="empty">Nenhum item zerado ou abaixo do mínimo definido, na data selecionada.</div>';
    return;
  }

  el.innerHTML = `<div class="table-wrap"><table>
    <tr><th>Loja</th><th>Categoria</th><th>Item</th><th>Quantidade</th><th>Mínimo</th><th>Situação</th><th>Definir mínimo</th></tr>
    ${linhas.map((l,idx) => `<tr>
      <td>${esc(l.loja)}</td>
      <td>${esc(l.categoria)}</td>
      <td>${esc(l.nome_produto)}${l.statusContagem!=='finalizada'?' <span class="hint" style="margin:0">(contagem em andamento)</span>':''}</td>
      <td>${Number(l.quantidade)} ${esc(l.unidade||'')}</td>
      <td>${l.minimo !== null ? l.minimo : '—'}</td>
      <td><span class="badge badge-${l.zerado?'zerado':'baixo'}">${l.zerado?'Zerado':'Baixo'}</span></td>
      <td>${l.chave ? `<input type="number" min="0" step="0.01" class="inp" style="width:80px" id="painelMin_${idx}" value="${l.minimo!==null?l.minimo:''}" placeholder="mín."> <button class="btn-sm btn" onclick="salvarEstoqueMinimoPainel('${l.categoria}','${l.itemId}',${idx})">Salvar</button>` : '—'}</td>
    </tr>`).join('')}
  </table></div>`;
}

async function salvarEstoqueMinimoPainel(categoria, itemId, idx){
  const valor = Number($('painelMin_'+idx).value);
  if (isNaN(valor) || valor < 0) { alert('Informe um valor válido.'); return; }
  const { error } = await sb.from('inventario_estoque_minimo').upsert({
    categoria, item_id: itemId, estoque_minimo: valor,
    atualizado_por: meuPerfil.id, atualizado_por_nome: meuPerfil.nome, atualizado_em: new Date().toISOString()
  }, { onConflict: 'categoria,item_id' });
  if (error) { alert('Erro ao salvar: ' + error.message); return; }
  await carregarEstoqueMinimoPainel();
  renderEstoqueBaixoPainel();
}

function onBuscarItemPainel(){
  const termo = $('painelBuscaItem').value.trim().toLowerCase();
  const el = $('painelBuscaResultado');
  if (!termo || termo.length < 2 || !painelItensCacheData) { el.innerHTML = ''; return; }

  const porNome = {};
  painelItensCacheData
    .filter(i => i.nome_produto.toLowerCase().includes(termo))
    .forEach(i => {
      const key = i.categoria+'|'+i.nome_produto;
      (porNome[key] = porNome[key] || { categoria: i.categoria, nome: i.nome_produto, porLoja: {} }).porLoja[i.loja] = { quantidade: i.quantidade, unidade: i.unidade, status: i.statusContagem };
    });

  const itensEncontrados = Object.values(porNome);
  if (!itensEncontrados.length) { el.innerHTML = '<div class="empty">Nenhum item encontrado com contagem na data selecionada.</div>'; return; }

  el.innerHTML = itensEncontrados.map(item => `
    <h3 style="font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--bordo-dark);margin:14px 0 6px">${esc(item.nome)} <span class="hint" style="margin:0">(${esc(item.categoria)})</span></h3>
    <div class="table-wrap"><table>
      <tr><th>Loja</th><th>Quantidade</th><th>Situação da contagem</th></tr>
      ${TODAS_LOJAS.map(loja => {
        const d = item.porLoja[loja];
        return `<tr><td>${esc(loja)}</td><td>${d ? Number(d.quantidade)+' '+esc(d.unidade||'') : '<span class="hint" style="margin:0">sem contagem nesta data</span>'}</td><td>${d ? (d.status==='finalizada'?'Finalizada':'Em andamento') : '—'}</td></tr>`;
      }).join('')}
    </table></div>`).join('');
}

// ── VALORIZAÇÃO DE ESTOQUE A CUSTO (Precificação — Loja + Estoque CD Luna) ──
let valorizacaoPainelCache = [];

async function carregarValorizacaoPainel(){
  const el = $('painelValorizacao');
  el.innerHTML = '<div class="loading">Carregando…</div>';

  // Busca própria (inclui CD Luna, que fica de fora do resto do Painel Central
  // por não ser uma "loja" de varejo comum).
  const { data: contagens } = await sb.from('inventario_contagens')
    .select('id, loja').eq('data_contagem', painelData).in('loja', [...TODAS_LOJAS, LOJA_CD]);
  const contagemIds = (contagens||[]).map(c => c.id);
  const contagemPorId = {};
  (contagens||[]).forEach(c => { contagemPorId[c.id] = c.loja; });

  if (!contagemIds.length){ el.innerHTML = '<div class="empty">Nenhuma contagem nessa data.</div>'; valorizacaoPainelCache = []; return; }

  const [{ data: itens }, { data: precosLoja }, { data: catalogoCD }] = await Promise.all([
    sb.from('inventario_itens').select('*').in('contagem_id', contagemIds),
    sb.from('precificacao_precos').select('produto_id, custo, vigencia_inicio').eq('elo','fabrica_loja').eq('status','aprovado').lte('vigencia_inicio', painelData).order('vigencia_inicio'),
    sb.from('inventario_itens_catalogo').select('id, luna_varejo_produto_id, custo_referencia'),
  ]);

  // Custo mais recente de cada produto da Precificação — Loja, até a data escolhida
  const custoPrecificacaoPorProduto = {};
  (precosLoja||[]).forEach(p => { custoPrecificacaoPorProduto[p.produto_id] = Number(p.custo); });

  // insumo_id (catálogo do Inventário) -> custo espelhado do CD Luna (sincronizado por gatilho)
  const custoCDPorInsumo = {};
  (catalogoCD||[]).forEach(c => { if (c.luna_varejo_produto_id != null && c.custo_referencia != null) custoCDPorInsumo[c.id] = Number(c.custo_referencia); });

  const linhas = (itens||[]).map(i => {
    let custoUnitario = null, origem = 'Sem custo';
    if (i.precificacao_produto_id && custoPrecificacaoPorProduto[i.precificacao_produto_id] != null) {
      custoUnitario = custoPrecificacaoPorProduto[i.precificacao_produto_id];
      origem = 'Precificação';
    } else if (i.insumo_id && custoCDPorInsumo[i.insumo_id] != null) {
      custoUnitario = custoCDPorInsumo[i.insumo_id];
      origem = 'CD Luna';
    }
    const valorTotal = custoUnitario != null ? Number(i.quantidade) * custoUnitario : null;
    return { loja: contagemPorId[i.contagem_id], categoria: i.categoria, nome: i.nome_produto, unidade: i.unidade, quantidade: Number(i.quantidade), custoUnitario, origem, valorTotal };
  }).sort((a,b) => a.loja.localeCompare(b.loja) || a.categoria.localeCompare(b.categoria) || a.nome.localeCompare(b.nome));

  valorizacaoPainelCache = linhas;

  if (!linhas.length){ el.innerHTML = '<div class="empty">Nenhum item contado nessa data.</div>'; return; }

  const totalGeral = linhas.reduce((s,l) => s + (l.valorTotal||0), 0);
  const semCusto = linhas.filter(l => l.valorTotal == null).length;

  el.innerHTML = `
    <div style="background:var(--creme);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;gap:24px;flex-wrap:wrap">
      <div><div style="font-size:.68rem;text-transform:uppercase;color:var(--text-light)">Valor total (a custo)</div><div style="font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:var(--bordo-dark)">${fmtMoeda(totalGeral)}</div></div>
      ${semCusto ? `<div><div style="font-size:.68rem;text-transform:uppercase;color:var(--text-light)">Itens sem custo cadastrado</div><div style="font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:#B8860B">${semCusto}</div></div>` : ''}
    </div>
    <div class="table-wrap"><table>
      <tr><th>Loja</th><th>Categoria</th><th>Item</th><th>Quantidade</th><th>Custo Unit.</th><th>Origem</th><th>Valor Total</th></tr>
      ${linhas.map(l => `<tr${l.valorTotal==null?' class="inativo"':''}>
        <td>${esc(l.loja)}</td>
        <td>${esc(l.categoria)}</td>
        <td>${esc(l.nome)}</td>
        <td>${fmt2(l.quantidade)} ${esc(l.unidade||'')}</td>
        <td>${l.custoUnitario!=null?fmtMoeda(l.custoUnitario):'—'}</td>
        <td>${l.origem}</td>
        <td>${l.valorTotal!=null?fmtMoeda(l.valorTotal):'<span class="hint" style="margin:0">sem custo</span>'}</td>
      </tr>`).join('')}
    </table></div>`;
}

function fmt2(v){ return Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 3 }); }

function exportarValorizacaoPainelCSV(){
  if (!valorizacaoPainelCache.length) { alert('Gere a valorização antes de exportar (mude a data pra recarregar, se preciso).'); return; }
  const esc2 = v => `"${String(v).replace(/"/g, '""')}"`;
  const linhas = [['Loja','Categoria','Item','Quantidade','Unidade','Custo Unitário','Origem do Custo','Valor Total'].map(esc2).join(',')];
  valorizacaoPainelCache.forEach(l => {
    linhas.push([l.loja, l.categoria, l.nome, l.quantidade, l.unidade||'', l.custoUnitario!=null?l.custoUnitario.toFixed(4):'', l.origem, l.valorTotal!=null?l.valorTotal.toFixed(2):''].map(esc2).join(','));
  });
  const csv = '\uFEFF' + linhas.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `valorizacao-estoque-${painelData}.csv`;
  a.click();
}

sb.auth.getSession().then(({ data }) => { if (data && data.session) verificarAcessoEIniciar(); else window.location.href = PORTAL_URL; });
</script>
